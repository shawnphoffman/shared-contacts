name: shared-contacts
services:
  shared-contacts-postgres:
    image: postgres:15.15-alpine
    container_name: shared-contacts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: sharedcontacts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared-contacts-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sharedcontacts} -d sharedcontacts']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
        compress: 'true'
    # A ceiling so one container cannot take the host down with it. Deliberately
    # generous rather than tight: too low a limit shows up as the OOM killer
    # ending a process mid-write, which is worse than no limit at all. Raise
    # them for a large address book.
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}

  shared-contacts-app:
    # Overridable so a deployment can pin a known-good release instead of
    # following whatever :latest points at: APP_VERSION=v1.12.0 docker compose up -d
    image: ghcr.io/shawnphoffman/shared-contacts:${APP_VERSION:-latest}
    container_name: shared-contacts-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@shared-contacts-postgres:5432/sharedcontacts
      NODE_ENV: production
      SYNC_INTERVAL: ${SYNC_INTERVAL:-30000}
      # Pinned, not defaulted from the host: the app and Postgres have to agree
      # on a zone, and a deployment platform injecting a local TZ here is what
      # put the two seven hours apart in the same row. Not ${TZ:-UTC} for that
      # reason. See migrations/22_contacts_timestamptz.sql.
      TZ: UTC
      # Services run unprivileged as this uid/gid. Set these to your host user
      # (`id -u` / `id -g`) so files on the bind-mounted ./backups are yours.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Scheduled backups written to BACKUP_DIR. Off by default; the Backups
      # page can still create one on demand. See docs/backups.md.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # Optional: Public URLs for CardDAV connection page (used for convenience only)
      # If not set, URLs will be derived from the current location
      # PUBLIC_UI_URL: https://contacts.example.com
      # PUBLIC_CARDDAV_URL: https://carddav.example.com
    volumes:
      - radicale_data:/data
      # Bind mount so archives land on the host, where an offsite sync (restic,
      # rclone, borg) can pick them up. Ownership follows PUID/PGID above.
      - ./backups:/backups
    # ports:
    #   - '${UI_PORT:-3030}:3030'
    networks:
      - shared-contacts-network
    depends_on:
      shared-contacts-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:3030/api/health'',(r)=>{process.exit(r.statusCode===200?0:1)}).on(''error'',()=>process.exit(1))" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
        compress: 'true'
    # See the note on the database above. This one runs three services and holds
    # whole vCards in memory during an import, including base64 photos, so it
    # gets the larger share.
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-2g}
    # labels:
    #   # TRAEFIK
    #   - traefik.enable=true
    #   - traefik.docker.network=proxy_net
    #   - traefik.http.middlewares.redir-https.redirectscheme.scheme=https
    #   # CONTACTS
    #   - traefik.http.routers.contacts.service=contacts
    #   - traefik.http.routers.contacts.rule=Host(`contacts.example.com`)
    #   - traefik.http.routers.contacts.entrypoints=websecure
    #   - traefik.http.routers.contacts.tls=true
    #   - traefik.http.routers.contacts.tls.certresolver=cloudflare
    #   - traefik.http.services.contacts.loadbalancer.server.port=3030
    #   # - HTTP > HTTPS
    #   - traefik.http.routers.contacts-http.entrypoints=web
    #   - traefik.http.routers.contacts-http.rule=Host(`contacts.example.com`)
    #   - traefik.http.routers.contacts-http.middlewares=redir-https
    #   # CARDDAV
    #   - traefik.http.routers.radicale.service=radicale
    #   - traefik.http.routers.radicale.rule=Host(`carddav.example.com`)
    #   - traefik.http.routers.radicale.entrypoints=websecure
    #   - traefik.http.routers.radicale.tls=true
    #   - traefik.http.routers.radicale.tls.certresolver=cloudflare
    #   - traefik.http.services.radicale.loadbalancer.server.port=5232
    #   # - HTTP > HTTPS
    #   - traefik.http.routers.radicale-http.entrypoints=web
    #   - traefik.http.routers.radicale-http.rule=Host(`carddav.example.com`)
    #   - traefik.http.routers.radicale-http.middlewares=redir-https

networks:
  shared-contacts-network:
    driver: bridge
    name: shared-contacts-network

volumes:
  postgres_data:
    name: shared-contacts-postgres-data
  radicale_data:
    name: shared-contacts-radicale-data
